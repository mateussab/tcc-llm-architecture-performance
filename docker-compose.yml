
services:

  monolith:
    image: tcc-llm-monolith:1.0
    build:
      context: ./monolith/tcc-llm-monolith
    ports:
      - "8080:8080"
    cpus: 4.0
    mem_limit: 2g
    networks:
      - tcc-network

  llm-service:
    image: tcc-llm-service:1.0
    build:
      context: ./microservices/llm-service
    cpus: 2.0
    mem_limit: 1g
    networks:
      - tcc-network

  chat-service:
    image: tcc-chat-service:1.0
    build:
      context: ./microservices/chat-service
    ports:
      - "8081:8081"
    environment:
      LLM_SERVICE_URL: http://llm-service:8082
    cpus: 2.0
    mem_limit: 1g
    depends_on:
      - llm-service
    networks:
      - tcc-network

networks:
  tcc-network:
    driver: bridge
